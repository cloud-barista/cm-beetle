test:
  # executionMode: migration (default) | recommendation | validation | all
  # Can be overridden by the CLI flag `-mode <mode>`.
  executionMode: migration

  set:
    mode: parallel # parallel (per target) or sequential
    # Stagger between parallel target starts, so concurrent runs do not burst
    # Tumblebug's read APIs at once.
    startDelaySeconds: 10

  # Target CSP/region pairs. Used across all modes.
  # For migration: enable one CSP at a time to prevent unexpected cloud costs.
  # For recommendation/validation: no provisioning occurs, so enabling multiple is fast and free.
  cases:
    - csp: aws
      region: ap-northeast-2
      name: AWS-Seoul
      execute: false
    - csp: azure
      region: koreasouth
      name: Azure-Busan
      execute: false
    - csp: gcp
      region: asia-northeast3
      name: GCP-Seoul
      execute: false
    - csp: alibaba
      region: ap-northeast-2
      name: Alibaba-Seoul
      execute: false
    - csp: tencent
      region: ap-seoul
      name: Tencent-Seoul
      execute: false
    - csp: ibm
      region: au-syd
      name: IBMCloud-Sydney
      execute: false
    - csp: ncp
      region: kr
      name: NCP-Seoul
      execute: false
    - csp: nhn
      region: kr1
      name: NHNCloud-Pangyo
      execute: false

  # On-premise scenario fixtures for recommendation mode (and the recommendation phase of 'all' mode).
  scenarios:
    - file: testconf/scenarios/honeybee-k8s-refined-infra.json
      name: baseline
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-workers0.json
      name: workers0
      execute: true
      expect:
        statusCode: 400

    - file: testconf/scenarios/honeybee-k8s-workers1.json
      name: workers1
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 1

    - file: testconf/scenarios/honeybee-k8s-workers5.json
      name: workers5
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 5

    - file: testconf/scenarios/honeybee-k8s-tiny.json
      name: tiny-upscale
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 1

    - file: testconf/scenarios/honeybee-k8s-3groups.json
      name: three-groups
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 2
        totalNodeSize: 3

    - file: testconf/scenarios/honeybee-k8s-hetero.json
      name: hetero-spec
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 2
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-converge.json
      name: converge-on-target-spec
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-k8sapi-cpus0.json
      name: k8s-api-collected-cpus0
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-mixed-arch.json
      name: mixed-arch
      execute: true
      expect:
        statusCode: 200
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-arm64.json
      name: arm64
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-samecpu-diffdisk.json
      name: samecpu-diffdisk
      execute: true
      expect:
        statusCode: 200
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-spec-small.json
      name: spec-small
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-spec-large.json
      name: spec-large
      execute: true
      expect:
        statusCode: 200
        nodeGroupCount: 1
        totalNodeSize: 2

    - file: testconf/scenarios/honeybee-k8s-v134.json
      name: version-1.34
      execute: true
      expect:
        statusCode: 200

    - file: testconf/scenarios/honeybee-k8s-v199.json
      name: version-1.99-fallback
      execute: true
      expect:
        statusCode: 200

    - file: testconf/scenarios/honeybee-k8s-norole.json
      name: no-worker-role
      execute: true
      expect:
        statusCode: 400

    - file: testconf/scenarios/negative/honeybee-k8s-raw-source-group.json
      name: neg-raw-source-group
      execute: true
      expect:
        statusCode: 400

    - file: testconf/scenarios/negative/honeybee-k8s-raw-connection-info.json
      name: neg-raw-connection-info
      execute: true
      expect:
        statusCode: 400

    - file: testconf/scenarios/negative/beetle-k8s-recommendation-request.json
      name: neg-unwrapped-servers
      execute: true
      expect:
        statusCode: 400

beetle:
  endpoint: http://localhost:8056
  namespaceId: mig01
  authConfigFile: testconf/auth-config.json
  requestBodyFile: testconf/recommendation-request.json
  nameSeed: mig

migration:
  mode: async # async (default) or sync
  timeoutSec: 2400

poll:
  intervalSec: 15
  timeoutSec: 2400

delete:
  timeoutSec: 1800
  retryIntervalSec: 10
  maxRetries: 3

verify:
  residualResources: true

workload:
  enabled: true
  kubeconfigTimeoutSec: 120
  kubeconfigPollSec: 5
  nodeReadyTimeoutSec: 600
  nodePollSec: 10
  podReadyTimeoutSec: 300
  podPollSec: 5
  loadBalancerEnabled: true
  lbAddressTimeoutSec: 300
  lbAccessTimeoutSec: 360
  lbPollSec: 10

