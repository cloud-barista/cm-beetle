name: Check API Diff on PR

on:
  # Use pull_request_target to enable write permissions for PRs from forks
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - "api/swagger.yaml"

env:
  API_DOC_PATH: api/swagger.yaml

jobs:
  api_diff_check:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.2"

      - name: Install DeepDiffGo
        run: |
          go install github.com/cloud-barista/cm-beetle/deepdiffgo/cmd/deepdiffgo@latest

      - name: Run DeepDiffGo and Generate Report
        id: deepdiff
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # ========================================================
          # 1. Setup Variables
          # ========================================================
          REPORT_FILE="api_diff_report.txt"
          PREV_SPEC_FILE="prev_spec.yaml"
          CURR_SPEC_FILE="pr_spec.yaml"
          SPEC_PATH="${{ env.API_DOC_PATH }}"

          # ========================================================
          # 2. Extract Previous and PR API Specs as Data
          # ========================================================
          echo "Extracting '$SPEC_PATH' from base branch '$BASE_REF' and PR commit..."

          git fetch origin --depth=1 "$PR_HEAD_SHA"

          if git show "HEAD:$SPEC_PATH" > "$PREV_SPEC_FILE"; then
            echo "Successfully extracted previous spec."
          else
            echo "Warning: Could not extract '$SPEC_PATH' from base branch."
            echo "   -> Assuming this is a new file. Creating an empty file for comparison."
            touch "$PREV_SPEC_FILE"
          fi

          if ! git show "$PR_HEAD_SHA:$SPEC_PATH" > "$CURR_SPEC_FILE"; then
            echo "No '$SPEC_PATH' found in PR commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="$(git rev-parse --short HEAD)"
          PR_HEAD_SHORT="$(git rev-parse --short "$PR_HEAD_SHA")"

          # ========================================================
          # 3. Execute DeepDiffGo (Compare Prev vs Curr)
          # ========================================================
          echo "Running DeepDiffGo..."

          if deepdiffgo "$PREV_SPEC_FILE" "$CURR_SPEC_FILE" \
            --old-desc "${BASE_REF}(${BASE_SHA})" \
            --new-desc "PR#${PR_NUMBER}(${PR_HEAD_SHORT})" \
            --format text \
            --output "$REPORT_FILE"; then
            echo "DeepDiffGo completed successfully."
          else
            echo "DeepDiffGo failed execution."
            # Fail gracefully without posting a comment
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ========================================================
          # 4. Process Output
          # ========================================================
          if [ -s "$REPORT_FILE" ]; then
              echo "API changes detected. Setting output..."
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              {
                echo "report_body<<DEEPDIFF_EOF"
                cat "$REPORT_FILE"
                echo "DEEPDIFF_EOF"
              } >> "$GITHUB_OUTPUT"
          else
              echo "No API changes detected."
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Comment to PR
        if: ${{ steps.deepdiff.outputs.has_changes == 'true' }}
        uses: actions/github-script@v9
        env:
          REPORT_BODY: ${{ steps.deepdiff.outputs.report_body }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Retrieve the report body from the previous step
            const reportBody = process.env.REPORT_BODY;

            const commentBody = [
              '## API Change Report',
              '',
              'The following API changes have been detected in this Pull Request compared to the base branch.',
              '',
              '```text',
              reportBody,
              '```'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });
