# Overlay file: extend docker-compose.yaml with UI-related services.
#
# Usage:
#   # Backend only (Beetle + Tumblebug stack):
#   docker compose -f docker-compose.yaml up
#
#   # Backend + Honeybee + Damselfly (no UI):
#   docker compose -f docker-compose.yaml -f docker-compose.ui.yaml up
#
#   # Full stack including UI dashboard:
#   docker compose -f docker-compose.yaml -f docker-compose.ui.yaml --profile ui up

services:
  # ============================================================================
  # 1. Dedicated OpenBao for CM-Honeybee (Secrets Backend)
  # ============================================================================
  openbao-honeybee:
    image: openbao/openbao:2.5.1
    container_name: openbao-honeybee
    cap_add:
      - IPC_LOCK
    networks:
      - cloud-barista
    ports:
      - target: 8200
        published: 8201
        protocol: tcp
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    entrypoint: ["sh", "-c"]
    command:
      - |
        chown -R openbao:openbao /openbao/data 2>/dev/null || true
        exec docker-entrypoint.sh server -config=/openbao/config/openbao-config.hcl
    volumes:
      - ./data/openbao-honeybee-data:/openbao/data
      - ./cm-honeybee/openbao/openbao-config.hcl:/openbao/config/openbao-config.hcl:ro
    healthcheck:
      # 0=unsealed, 1=sealed, 2=uninitialized — all mean OpenBao process is ready;
      # cm-honeybee automatically initializes/unseals it on startup.
      test: ["CMD", "sh", "-c", "rc=0; bao status || rc=$$?; [ $$rc -le 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ============================================================================
  # 2. CM-Honeybee (On-Premise Infrastructure Extractor)
  # ============================================================================
  cm-honeybee:
    image: cloudbaristaorg/cm-honeybee:0.6.0
    container_name: cm-honeybee
    networks:
      - cloud-barista
    ports:
      - "8081:8081"
      - "8082:8082"
    depends_on:
      openbao-honeybee:
        condition: service_healthy
      cb-spider:
        condition: service_started
    environment:
      - HONEYBEE_API_ALLOW_ORIGINS=*
      - HONEYBEE_LOG_LEVEL=debug
      - HONEYBEE_VAULT_ADDR=http://openbao-honeybee:8200
      - HONEYBEE_SPIDER_ENDPOINT=http://cb-spider:1024/spider
      - HONEYBEE_SPIDER_USERNAME=${SP_API_USERNAME:-default}
      - HONEYBEE_SPIDER_PASSWORD=${SP_API_PASSWORD:-default}
    volumes:
      - ./data/cm-honeybee-container/data/:/root/.cm-honeybee/:rw
      - ./data/cm-honeybee-container/db/:/app/db/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/honeybee/readyz"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # 3. CM-Damselfly (On-Premise & Cloud Infrastructure Model Repository)
  # ============================================================================
  cm-damselfly:
    image: cloudbaristaorg/cm-damselfly:0.6.2
    container_name: cm-damselfly
    networks:
      - cloud-barista
    ports:
      - "8088:8088"
    environment:
      - DAMSELFLY_API_ALLOW_ORIGINS=*
      - DAMSELFLY_LOG_LEVEL=debug
    volumes:
      - ./data/cm-damselfly-container/db/:/app/db/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/damselfly/readyz"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # 4. CM-Beetle UI (Next.js Dashboard, proxies to backend services)
  #    Excluded from default 'up' — started explicitly with --profile ui
  #    For local development, run:  cd ui && npm run dev
  # ============================================================================
  cm-beetle-ui:
    profiles: [ui]
    build:
      context: ../../ui
      dockerfile: Dockerfile
    image: cloudbaristaorg/cm-beetle-ui:latest
    container_name: cm-beetle-ui
    networks:
      - cloud-barista
    ports:
      - "3000:3000"
    environment:
      # Resolved server-side via Docker internal DNS from docker-compose.yaml network.
      - BEETLE_ENDPOINT=http://cm-beetle:8056
      - TUMBLEBUG_ENDPOINT=http://cb-tumblebug:1323
      - HONEYBEE_ENDPOINT=http://cm-honeybee:8081
      - DAMSELFLY_ENDPOINT=http://cm-damselfly:8088
      - SPIDER_ENDPOINT=http://cb-spider:1024
      - MAPUI_ENDPOINT=http://cb-mapui:1324
    depends_on:
      - cm-beetle
      - cm-honeybee
      - cm-damselfly
      - cb-tumblebug
      - cb-spider
      - cb-mapui
    restart: unless-stopped
